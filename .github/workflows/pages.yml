name: Deploy KaloriKu to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build self-contained KaloriKu site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data icons
          curl --fail --location --retry 3 "https://kaloriku-iota.vercel.app/app.js" -o app.js
          curl --fail --location --retry 3 "https://kaloriku-iota.vercel.app/data/foods.json" -o data/foods.json
          curl --fail --location --retry 3 "https://kaloriku-iota.vercel.app/icons/icon-192.png" -o icons/icon-192.png
          curl --fail --location --retry 3 "https://kaloriku-iota.vercel.app/icons/icon-512.png" -o icons/icon-512.png
          test -s app.js
          test -s data/foods.json
          echo "KaloriKu assets ready"

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
