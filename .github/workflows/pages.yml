name: Deploy KaloriKu to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bundled KaloriKu assets
        shell: bash
        run: |
          set -euo pipefail
          test -s app.js
          test -s data/foods.json
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          echo "All KaloriKu runtime assets are stored in GitHub."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate expanded food catalog
        run: |
          node --check app.js
          node --check ai-photo.js
          node --test tests/catalog.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
